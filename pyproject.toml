[project]
name = "setfit-finetuning"
version = "0.1.0"
description = "SetFit fine-tuning with ModernBERT"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "datasets",
    "setfit",
    "transformers",
    "numpy",
    "scikit-learn",
    "sentence-transformers",
    "torch",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
