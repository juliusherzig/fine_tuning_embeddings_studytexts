[project]
name = "setfit-finetuning"
version = "0.1.0"
description = "SetFit fine-tuning with ModernBERT"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "datasets",
    "setfit",
    "transformers",
    "numpy",
    "torch",
    "scikit-learn",
    "sentence-transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
